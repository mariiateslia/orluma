name: Verify Orluma
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker compose config --quiet
      - run: docker compose up --build --wait
      - run: node scripts/container-smoke.js seed "$RUNNER_TEMP/orluma-smoke.json"
      - run: docker compose restart && docker compose up --wait
      - run: node scripts/container-smoke.js verify "$RUNNER_TEMP/orluma-smoke.json"
      - run: docker compose logs --tail=100
        if: failure()
      - run: docker compose down -v
        if: always()
